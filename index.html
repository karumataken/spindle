<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spindle</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/favicon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond, Plus Jakarta Sans, JetBrains Mono, Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        // Early theme restoration to avoid any light-to-dark flash on launch
        try {
            if (localStorage.getItem('spindle:theme') === 'dark') {
                document.documentElement.classList.add('dark-theme');
                document.body?.classList.add('dark-theme');
            }
        } catch (_) {}
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alabaster: '#F6F4F0',
                        oatmeal: '#EBE7DF',
                        stone: '#DCD6CB',
                        espresso: '#1E1B18',
                        walnut: '#5C3A21',
                        terracotta: '#C85A32',
                        brass: '#D4AF37',
                        muted: '#78716C'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        cursive: ['"Caveat"', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        /* Critical initial styles to guarantee zero FOUC flash of sidebar on startup */
        #sidebar-panel.intro-hidden {
            margin-top: -100vh !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        @media (min-width: 1024px) {
            #sidebar-panel.intro-hidden {
                margin-top: 0 !important;
                margin-left: -460px !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
        }
        @media (min-width: 1280px) {
            #sidebar-panel.intro-hidden {
                margin-left: -510px !important;
            }
        }

        /* Upright 3D Coin-Spinning Vinyl Loading Screen */
        :root {
            --vinyl-size: 68px;
            --vinyl-label-color: #C85A32;
        }
        .loader-overlay {
            position: fixed;
            top: 28px; /* sits right below the thin title bar */
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #F6F4F0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 50;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            pointer-events: all;
        }
        body.dark-theme .loader-overlay,
        html.dark-theme .loader-overlay {
            background-color: #211E1B;
        }
        .loader-overlay.is-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
        .vinyl-scene {
            position: relative;
            width: var(--vinyl-size);
            height: var(--vinyl-size);
            perspective: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vinyl-coin-pivot {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: coin-spin 1.35s linear infinite;
        }
        .vinyl-disc,
        .vinyl-edge {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform: translateZ(var(--z));
            -webkit-mask-image: radial-gradient(circle, transparent 6.5%, #000 7.5%);
            mask-image: radial-gradient(circle, transparent 6.5%, #000 7.5%);
        }
        .vinyl-edge {
            background: #11100F;
            box-shadow: inset 0 0 0 1px #2C2825;
        }
        .vinyl-face {
            background:
                conic-gradient(
                    from 45deg,
                    transparent 0deg,
                    rgba(255, 255, 255, 0.16) 22deg,
                    transparent 45deg,
                    transparent 180deg,
                    rgba(255, 255, 255, 0.16) 202deg,
                    transparent 225deg
                ),
                radial-gradient(
                    circle,
                    #181513 0%,
                    #181513 9%,
                    var(--vinyl-label-color) 9.5%,
                    #A04322 29%,
                    #12100E 30%,
                    transparent 31%
                ),
                repeating-radial-gradient(
                    circle,
                    #181614 0px,
                    #181614 1.5px,
                    #24211E 2px,
                    #181614 3px
                );
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
        }
        .vinyl-floor-shadow {
            position: absolute;
            bottom: -15px;
            width: 65%;
            height: 7px;
            background: radial-gradient(ellipse at center, rgba(30, 27, 24, 0.45) 0%, transparent 75%);
            border-radius: 50%;
            animation: shadow-pulse 1.35s ease-in-out infinite;
        }
        body.dark-theme .vinyl-floor-shadow {
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.75) 0%, transparent 75%);
        }
        @keyframes coin-spin {
            0% {
                transform: rotateX(14deg) rotateY(0deg) rotateZ(0deg);
            }
            50% {
                transform: rotateX(-14deg) rotateY(180deg) rotateZ(180deg);
            }
            100% {
                transform: rotateX(14deg) rotateY(360deg) rotateZ(360deg);
            }
        }
        @keyframes shadow-pulse {
            0%, 100% {
                transform: scaleX(0.95);
                opacity: 0.65;
            }
            25%, 75% {
                transform: scaleX(0.35);
                opacity: 0.35;
            }
            50% {
                transform: scaleX(0.95);
                opacity: 0.65;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none bg-alabaster">

    <!-- THIN CUSTOM WINDOW TITLE BAR (Frameless window draggable header) -->
    <div id="spindle-titlebar" class="w-full h-7 shrink-0 bg-alabaster border-b border-stone/50 flex items-center justify-end px-1.5 z-40 transition-colors duration-250" style="-webkit-app-region: drag;">
        <!-- Window Controls (Minimize, Maximize/Restore, Close) -->
        <div class="flex items-center gap-0.5 h-full" style="-webkit-app-region: no-drag;">
            <button id="titlebar-minimize" type="button" class="w-7 h-5 flex items-center justify-center rounded-md text-muted hover:text-espresso hover:bg-oatmeal transition" title="Minimize">
                <svg class="w-2.5 h-2.5" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2" fill="none">
                    <line x1="1" y1="5" x2="9" y2="5" stroke-linecap="round"/>
                </svg>
            </button>
            <button id="titlebar-maximize" type="button" class="w-7 h-5 flex items-center justify-center rounded-md text-muted hover:text-espresso hover:bg-oatmeal transition" title="Maximize">
                <svg id="titlebar-max-icon" class="w-2.5 h-2.5" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.1" fill="none">
                    <rect x="1.5" y="1.5" width="7" height="7" rx="1"/>
                </svg>
            </button>
            <button id="titlebar-close" type="button" class="w-7 h-5 flex items-center justify-center rounded-md text-muted hover:text-alabaster hover:bg-terracotta transition" title="Close">
                <svg class="w-2.5 h-2.5" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none">
                    <line x1="2" y1="2" x2="8" y2="8"/>
                    <line x1="8" y1="2" x2="2" y2="8"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- 3D ROTATING VINYL LOADING SCREEN -->
    <div id="app-loader" class="loader-overlay" aria-label="Loading Spindle">
        <div class="vinyl-scene">
            <div class="vinyl-coin-pivot">
                <!-- 3D Thickness Layers (Back to Front) -->
                <div class="vinyl-disc vinyl-face" style="--z: -2px"></div>
                <div class="vinyl-edge" style="--z: -1px"></div>
                <div class="vinyl-edge" style="--z: 0px"></div>
                <div class="vinyl-edge" style="--z: 1px"></div>
                <div class="vinyl-disc vinyl-face" style="--z: 2px"></div>
            </div>
            <!-- Subtle surface shadow underneath the spinning vinyl -->
            <div class="vinyl-floor-shadow"></div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT CONTAINER -->
    <div id="app-layout-container" class="flex-1 w-full min-h-0 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- LEFT PANEL: SIDEBAR MENU & PLAYER -->
    <aside id="sidebar-panel" class="w-full lg:w-[460px] xl:w-[510px] h-[58%] lg:h-full bg-alabaster border-b lg:border-b-0 lg:border-r border-stone/70 flex flex-col justify-between z-20 shadow-xl lg:shadow-none transition-colors duration-300 intro-hidden">
        
        <!-- Top Header with Spindle Cursive Logo -->
        <header class="px-6 pt-3.5 pb-2.5 flex items-center justify-between border-b border-stone/50 shrink-0">
            <div class="flex items-center gap-2">
                <button id="btn-about-app" type="button" class="flex items-center gap-2 group text-left cursor-pointer focus:outline-none" title="About Spindle & Updates">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 46" class="h-9 w-auto">
                        <text id="spindle-logo-text" x="2" y="35" font-family="'Caveat', cursive" font-weight="600" font-size="42" fill="#1E1B18" class="transition-colors duration-200">Spindle</text>
                    </svg>
                    <span id="app-version-badge" class="font-mono text-[10px] px-1.5 py-0.5 rounded-md bg-oatmeal border border-stone/70 text-muted group-hover:text-espresso group-hover:border-terracotta transition shrink-0">v1.0.1</span>
                </button>
            </div>
            <!-- Search bar for playlists and songs -->
            <div class="relative flex items-center w-44 sm:w-52">
                <span class="absolute left-2.5 text-muted pointer-events-none flex items-center">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                </span>
                <input 
                    id="search-input" 
                    type="text" 
                    placeholder="Search playlists & songs..." 
                    autocomplete="off"
                    spellcheck="false"
                    class="w-full pl-8 pr-7 py-1 text-xs rounded-full bg-oatmeal/60 border border-stone/70 text-espresso placeholder:text-muted/60 focus:outline-none focus:border-terracotta focus:bg-alabaster transition-colors duration-200"
                />
                <button 
                    id="btn-search-clear" 
                    type="button" 
                    class="absolute right-2 text-muted hover:text-espresso hidden p-0.5 rounded-full"
                    title="Clear search"
                >
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Update Notification Banner (slides down when an update is available) -->
        <div id="update-notification-banner" class="hidden px-4 py-2 bg-terracotta/10 border-b border-terracotta/30 items-center justify-between text-xs text-espresso transition-all duration-300">
            <div class="flex items-center gap-2 min-w-0 pr-2">
                <span class="w-2 h-2 rounded-full bg-terracotta shrink-0 animate-pulse"></span>
                <p class="truncate"><strong id="update-tag-text">Update available</strong> — <span id="update-name-text" class="text-muted">New release ready</span></p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="btn-update-open" type="button" class="px-2.5 py-1 rounded-lg bg-terracotta text-alabaster hover:bg-[#b04b25] text-[11px] font-medium transition shadow-xs">
                    Update
                </button>
                <button id="btn-update-dismiss" type="button" class="p-1 rounded-lg hover:bg-oatmeal text-muted hover:text-espresso transition" title="Dismiss">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <!-- TOP OF MENU: CURRENTLY OPENED PLAYLIST HERO (Centered, bigger artwork, details below) -->
        <section id="opened-playlist-hero" class="hidden px-6 pt-4 pb-4 border-b border-stone/60 bg-alabaster flex-col items-center text-center shrink-0 relative transition-colors duration-300">
            <!-- Back to Playlists Button (Top-Left of Hero) -->
            <button id="btn-back-playlists" class="absolute left-5 top-4 inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-medium text-muted hover:text-espresso hover:bg-oatmeal transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>Playlists</span>
            </button>

            <!-- Playlist 3-Dot Options Button (Top-Right of Hero) -->
            <button id="btn-hero-playlist-menu" class="absolute right-5 top-4 p-2 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal transition" title="Playlist Options">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>
                </svg>
            </button>

            <!-- Centered Larger Playlist Artwork -->
            <div id="hero-playlist-artwork" title="Click to Change Artwork" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl bg-espresso shadow-md flex items-center justify-center overflow-hidden border border-stone cursor-pointer group relative mt-1 mx-auto">
                <!-- Populated dynamically via JS -->
            </div>

            <!-- Playlist Title & Metadata Below Artwork -->
            <h1 id="hero-playlist-title" class="font-serif text-2xl sm:text-3xl font-semibold text-espresso truncate max-w-full leading-tight mt-3">
                Playlist Title
            </h1>
            <p id="hero-playlist-meta" class="font-mono text-[11px] text-muted mt-0.5">
                0 songs • 00:00
            </p>

            <!-- Playlist Action Controls Below Metadata -->
            <div class="flex items-center justify-center gap-2 mt-3">
                <button id="btn-hero-play" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-terracotta text-alabaster hover:bg-[#b04b25] text-xs font-medium transition shadow-sm active:scale-95">
                    <svg class="w-3.5 h-3.5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <span>Play</span>
                </button>

                <button id="btn-hero-add-songs" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl border border-stone bg-oatmeal/70 hover:bg-oatmeal text-espresso text-xs font-medium transition active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Add Songs</span>
                </button>

                <button id="btn-toggle-reorder" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-stone bg-alabaster hover:bg-oatmeal text-espresso text-xs font-medium transition active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                    <span id="reorder-btn-label">Reorder</span>
                </button>
            </div>
        </section>

        <!-- MIDDLE SECTION: PLAYLISTS OVERVIEW OR SONGS LIST -->
        <section id="playlist-list-section" class="flex-1 flex flex-col min-h-0 bg-[#F2EFE9] transition-colors duration-250">
            <!-- Section Subheader (Visible in Playlists Overview mode) -->
            <div id="playlists-overview-header" class="px-6 py-3 flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 min-w-0">
                    <h2 class="font-mono text-xs uppercase tracking-wider text-muted font-medium truncate">
                        Playlists
                    </h2>
                    <span id="playlist-count" class="font-mono text-[11px] px-2 py-0.5 rounded-full bg-stone/60 text-espresso shrink-0">0</span>
                </div>
                
                <button id="btn-create-playlist" class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-terracotta text-alabaster hover:bg-[#b04b25] text-xs font-medium transition shadow-sm active:scale-95">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Create Playlist</span>
                </button>
            </div>

            <!-- List Container -->
            <div id="playlist-container" class="flex-1 overflow-y-auto px-4 py-2.5 space-y-1.5 relative">
                <!-- Populated dynamically via JS -->
            </div>
        </section>

        <!-- BOTTOM SECTION: CURRENTLY PLAYING DECK (Hidden initially until a song/playlist is started) -->
        <section id="now-playing-section" class="hidden px-6 py-3.5 bg-alabaster border-t border-stone/80 flex-col gap-3 shrink-0 shadow-[0_-4px_20px_rgba(30,27,24,0.06)] transition-colors duration-300">
            <div class="flex items-center gap-4">
                <!-- Mini Playlist Artwork / Spinning Disc Cover -->
                <div class="relative w-14 h-14 rounded-2xl bg-espresso shadow-md flex items-center justify-center overflow-hidden shrink-0 border border-stone">
                    <img id="now-playing-art-img" class="absolute inset-0 w-full h-full object-cover object-center hidden" alt="Artwork">
                    <div id="cover-disc" class="w-11 h-11 rounded-full border-2 border-neutral-800 flex items-center justify-center spin-art" style="background: radial-gradient(circle, #C85A32 0%, #C85A32 28%, #141413 30%, #222 45%, #111 47%, #292929 65%, #111 70%, #1c1c1c 100%);">
                        <div class="w-2 h-2 rounded-full bg-alabaster"></div>
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-tr from-black/20 via-transparent to-white/10 pointer-events-none"></div>
                </div>

                <!-- Track Metadata -->
                <div class="flex flex-col min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                        <span id="NowPlaying-playlist-name" class="font-mono text-[10px] uppercase tracking-wider text-terracotta font-semibold truncate">Playlist</span>
                    </div>
                    <h2 id="current-title" class="font-serif text-xl sm:text-2xl font-semibold text-espresso truncate leading-tight">
                        Velvet Espresso
                    </h2>
                    <p id="current-artist" class="text-xs text-muted truncate font-normal">
                        Aura Analog Ensemble
                    </p>
                </div>
            </div>

            <!-- Progress & Scrubber -->
            <div class="flex flex-col gap-1">
                <div class="relative w-full flex items-center">
                    <input 
                        id="seek-slider" 
                        type="range" 
                        min="0" 
                        max="1000" 
                        value="0" 
                        class="w-full z-10"
                        aria-label="Seek time"
                    >
                    <div class="w-full h-1 bg-stone rounded-full absolute left-0 pointer-events-none overflow-hidden">
                        <div id="seek-fill" class="h-full bg-terracotta transition-all duration-75" style="width: 0%;"></div>
                    </div>
                </div>
                <div class="flex justify-between font-mono text-[10px] text-muted">
                    <span id="time-current">00:00</span>
                    <span id="time-total">02:15</span>
                </div>
            </div>

            <!-- Playback Controls & Volume -->
            <div class="flex items-center justify-between gap-2">
                <!-- Transport Buttons -->
                <div class="flex items-center gap-1 sm:gap-1.5">
                    <!-- Previous -->
                    <button id="btn-prev" title="Previous" class="p-2 rounded-xl text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>

                    <!-- Play / Pause -->
                    <button id="btn-play" title="Play / Pause" class="w-10 h-10 rounded-2xl bg-terracotta text-alabaster hover:bg-[#b04b25] active:scale-95 transition-all flex items-center justify-center shadow-md">
                        <svg id="icon-play" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg id="icon-pause" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>

                    <!-- Stop -->
                    <button id="btn-stop" title="Stop" class="p-2 rounded-xl text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 6h12v12H6z"/>
                        </svg>
                    </button>

                    <!-- Next -->
                    <button id="btn-next" title="Next" class="p-2 rounded-xl text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>

                    <!-- Shuffle -->
                    <button id="btn-shuffle" title="Shuffle" class="p-1.5 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal active:scale-95 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
                        </svg>
                    </button>

                    <!-- Repeat -->
                    <button id="btn-repeat" title="Repeat" class="p-1.5 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal active:scale-95 transition relative">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/>
                        </svg>
                        <span id="repeat-one-badge" class="hidden absolute top-0 right-0 text-[8px] font-mono bg-terracotta text-alabaster w-3 h-3 rounded-full flex items-center justify-center">1</span>
                    </button>
                </div>

                <!-- Volume & Crackle Toggle -->
                <div class="flex items-center gap-2.5">
                    <button id="btn-crackle" title="Toggle Surface Crackle" class="px-2 py-1 rounded-lg border border-stone bg-oatmeal/70 hover:bg-oatmeal text-[10px] font-mono text-espresso flex items-center gap-1.5 transition">
                        <span id="crackle-dot" class="w-2 h-2 rounded-full bg-terracotta"></span>
                        <span>CRACKLE</span>
                    </button>

                    <div class="hidden sm:flex items-center gap-1.5 w-20">
                        <button id="btn-mute" class="text-muted hover:text-espresso transition" title="Mute/Unmute">
                            <svg id="icon-vol" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                            </svg>
                        </button>
                        <div class="relative flex-1 flex items-center">
                            <input id="vol-slider" type="range" min="0" max="1" step="0.01" value="0.8" class="w-full z-10" aria-label="Volume">
                            <div class="w-full h-1 bg-stone rounded-full absolute left-0 pointer-events-none overflow-hidden">
                                <div id="vol-fill" class="h-full bg-terracotta" style="width: 80%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </aside>

    <!-- RIGHT PANEL: INTERACTIVE 3D RECORD PLAYER -->
    <main id="viewport-main" class="flex-1 h-[42%] lg:h-full relative bg-gradient-to-br from-[#EFECE6] via-[#E5DFD5] to-[#D6CFC2] overflow-hidden transition-colors duration-500">
        <!-- Three.js Canvas Mount -->
        <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

        <!-- Floating Top HUD Controls -->
        <div id="hud-top" class="absolute top-4 left-4 right-4 flex flex-wrap items-center justify-between gap-2 pointer-events-none transition-opacity duration-700 opacity-0">
            
            <!-- Top-Left: Compact Left-to-Right Light / Dark Theme Toggle Switch -->
            <button id="btn-theme-toggle" type="button" aria-label="Toggle Light/Dark Theme" class="pointer-events-auto relative w-16 h-8 rounded-full bg-alabaster/85 backdrop-blur-md border border-stone/80 p-1 flex items-center justify-between shadow-sm cursor-pointer transition-colors duration-300">
                <!-- Sliding Pill Thumb -->
                <div id="theme-toggle-thumb" class="w-6 h-6 rounded-full bg-terracotta shadow-xs transition-transform duration-300 ease-out translate-x-0"></div>
                <!-- Centered Sun / Moon Icons -->
                <div class="absolute inset-1 flex items-center justify-between pointer-events-none">
                    <span id="theme-label-light" class="w-6 h-6 flex items-center justify-center text-alabaster transition-colors duration-300">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="4"/>
                            <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/>
                        </svg>
                    </span>
                    <span id="theme-label-dark" class="w-6 h-6 flex items-center justify-center text-muted transition-colors duration-300">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                        </svg>
                    </span>
                </div>
            </button>

            <!-- Top-Right: Manual Camera Preset Angles & Dust Cover Toggle -->
            <div class="pointer-events-auto flex items-center gap-1.5 bg-alabaster/85 backdrop-blur-md border border-stone/80 p-1.5 rounded-2xl shadow-sm transition-colors duration-300">
                <button data-cam="iso" class="cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] bg-terracotta text-alabaster transition">ISO</button>
                <button data-cam="top" class="cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition">TOP</button>
                <button data-cam="side" class="cam-btn px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition">SIDE</button>
                <div class="h-4 w-[1px] bg-stone mx-0.5"></div>
                <button id="btn-cover-toggle" class="px-2.5 py-1 rounded-xl font-mono text-[11px] text-espresso hover:bg-oatmeal transition" title="Open / Close Acrylic Dust Cover">COVER</button>
            </div>
        </div>

        <!-- Bottom Hint Overlay (subtle, no island) -->
        <div id="hud-bottom-hint" class="absolute bottom-3 right-4 pointer-events-none hidden sm:flex items-center gap-2 text-[10px] font-mono text-muted/40 tracking-wider uppercase select-none transition-opacity duration-700 opacity-0">
            <span>Orbit: Drag</span>
            <span>•</span>
            <span>Zoom: Scroll</span>
        </div>

        <!-- Floating Interactive Needle Drop Tooltip (Minimalist, translucent seek time) -->
        <div id="needle-drop-hint" class="fixed pointer-events-none hidden items-center justify-center bg-espresso/50 text-alabaster border border-alabaster/15 px-3 py-1 rounded-full shadow-lg backdrop-blur-md transition-opacity duration-150 z-50 select-none">
            <span id="needle-drop-time" class="font-mono text-xs text-alabaster/95 font-medium tracking-wider">00:00</span>
        </div>

        <!-- Fine text prompt below the turntable for initial startup -->
        <div id="intro-prompt" class="absolute inset-x-0 bottom-10 sm:bottom-14 flex flex-col items-center justify-center pointer-events-none transition-opacity duration-700 z-30">
            <p class="font-serif italic text-lg sm:text-xl text-espresso/60 tracking-[0.25em] select-none transition-colors duration-300 animate-pulse">
                click to open
            </p>
        </div>

        <!-- Fullscreen transparent click-to-open catcher -->
        <div id="intro-overlay" class="fixed inset-0 z-30 cursor-pointer" title="Click to open"></div>

        <!-- Drag & Drop Overlay -->
        <div id="drop-overlay" class="fixed inset-0 bg-espresso/70 backdrop-blur-sm z-50 hidden items-center justify-center p-6">
            <div class="border-2 border-dashed border-alabaster rounded-3xl p-12 text-center max-w-md">
                <p class="font-serif text-3xl text-alabaster mb-2">Drop Audio Files</p>
                <p class="font-mono text-xs text-stone uppercase tracking-wider">Files will be added to your playlist</p>
            </div>
        </div>
    </main>
    </div>

    <!-- FLOATING 3-DOT CONTEXT MENU -->
    <div id="context-menu" class="fixed z-50 hidden min-w-[190px] bg-alabaster border border-stone rounded-2xl shadow-xl py-1.5 text-xs text-espresso overflow-hidden"></div>

    <!-- MODAL OVERLAY -->
    <div id="modal-backdrop" class="fixed inset-0 bg-espresso/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div id="modal-card" class="bg-alabaster border border-stone rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-stone/60 flex items-center justify-between">
                <h3 id="modal-title" class="font-serif text-2xl font-semibold text-espresso">Modal Title</h3>
                <button id="modal-close" class="p-1.5 rounded-xl text-muted hover:text-espresso hover:bg-oatmeal transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modal-body" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- Hidden Inputs & HTML5 Audio Element -->
    <input id="file-upload-audio" type="file" accept="audio/*,.mp3,.wav,.flac,.ogg,.m4a,.aac" multiple class="hidden">
    <input id="file-upload-artwork" type="file" accept="image/*" class="hidden">
    <audio id="html5-audio" preload="metadata"></audio>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
