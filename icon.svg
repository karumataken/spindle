<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <!-- 
    VINYL RECORD 
    The center is placed at x=100.
    The jacket ends at x=100, meaning exactly half the record is exposed.
  -->
  <g id="vinyl-record">
    <!-- Main vinyl disc -->
    <circle cx="100" cy="50" r="43" fill="#181818" />
    
    <!-- Grooves -->
    <circle cx="100" cy="50" r="38" fill="none" stroke="#2c2c2c" stroke-width="1.2" />
    <circle cx="100" cy="50" r="32" fill="none" stroke="#2c2c2c" stroke-width="1" />
    <circle cx="100" cy="50" r="26" fill="none" stroke="#2c2c2c" stroke-width="1.2" />
    <circle cx="100" cy="50" r="20" fill="none" stroke="#2c2c2c" stroke-width="0.8" />

    <!-- Vintage Minimal Record Label -->
    <circle cx="100" cy="50" r="14" fill="#C25946" />
    <circle cx="100" cy="50" r="13" fill="none" stroke="#EAE3D2" stroke-width="0.5" opacity="0.5" />
    <circle cx="100" cy="50" r="10" fill="none" stroke="#2E4A4D" stroke-width="0.5" opacity="0.4" />
    
    <!-- Spindle Hole -->
    <circle cx="100" cy="50" r="2.5" fill="#F4F4F4" />
  </g>

  <!-- 
    VINTAGE SQUARE JACKET
    Covers from x=10 to x=100 (Width=90), y=5 to y=95 (Height=90). Perfect square.
  -->
  <g id="record-jacket">
    <!-- Back inner lip of the sleeve (gives depth to the right-side opening) -->
    <path d="M 97 6 L 102 8 L 102 92 L 97 94 Z" fill="#3B2E24" />
    
    <!-- Base Worn Cardboard/Parchment Color -->
    <rect x="10" y="5" width="90" height="90" rx="1.5" fill="#EAE3D2" />
    
    <!-- Minimalist Mid-Century Artwork (Vertical Stripes) -->
    <rect x="20" y="5" width="2" height="90" fill="#C25946" opacity="0.85" />
    <rect x="25" y="5" width="8" height="90" fill="#2E4A4D" opacity="0.9" />

    <!-- Vintage Ring Wear (Classic fading/distress on old records) -->
    <circle cx="55" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.45" />
    <circle cx="55" cy="50" r="40" fill="none" stroke="#B8A892" stroke-width="1.5" opacity="0.25" />
    <circle cx="55" cy="50" r="39" fill="none" stroke="#8A7B66" stroke-width="1" opacity="0.1" />

    <!-- Minimal Writing / Faux Typography -->
    <!-- Tiny catalog number in top right -->
    <rect x="85" y="10" width="10" height="1.5" fill="#666666" />
    <rect x="85" y="13" width="6" height="1" fill="#888888" />
    
    <!-- Minimal Artist / Title block in bottom right -->
    <rect x="65" y="83" width="30" height="2.5" fill="#2E4A4D" />
    <rect x="75" y="88" width="20" height="1.5" fill="#C25946" />

    <!-- Distressed Corners / Creases -->
    <path d="M 10 15 Q 16 15 16 5" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />
    <path d="M 10 85 Q 16 85 16 95" fill="none" stroke="#B8A892" stroke-width="1.5" opacity="0.5" />
    
    <!-- Edge wear border -->
    <rect x="10" y="5" width="90" height="90" rx="1.5" fill="none" stroke="#CFC2AC" stroke-width="1.5" />
    
    <!-- Right edge slit highlight (emphasizes the opening) -->
    <line x1="99" y1="6" x2="99" y2="94" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7" />
    <!-- Drop shadow cast by the sleeve edge onto the exposed record -->
    <line x1="100.5" y1="6" x2="100.5" y2="94" stroke="#000000" stroke-width="1.5" opacity="0.15" />
  </g>
</svg>